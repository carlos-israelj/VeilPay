services:
  # Main Relayer Service
  - type: web
    name: veilpay-x402-relayer
    runtime: node
    region: oregon
    plan: starter
    buildCommand: cd relayer && npm install
    startCommand: cd relayer && npm start
    envVars:
      # Server Configuration
      - key: PORT
        value: 4000

      # Stacks Network (testnet for demo, mainnet for production)
      - key: STACKS_NETWORK
        value: testnet

      # VeilPay Contract Details
      - key: CONTRACT_ADDRESS
        value: ST2TVNVEDWFBX25NRW8GP6D3WHAXEXGH7T3MBT1T1
      - key: CONTRACT_NAME
        value: veilpay

      # USDCx Token Contract
      - key: USDCX_ADDRESS
        value: ST1PQHQKV0RJXZFY1DGX8MNSNYVE3VGZJSRTPGZGM
      - key: USDCX_NAME
        value: usdcx

      # Multi-Asset Pool Contracts (Testnet) - DEPLOYED
      - key: USDCX_CONTRACT_TESTNET
        value: ST2TVNVEDWFBX25NRW8GP6D3WHAXEXGH7T3MBT1T1.veilpay-usdcx
      - key: SBTC_CONTRACT_TESTNET
        value: ST2TVNVEDWFBX25NRW8GP6D3WHAXEXGH7T3MBT1T1.veilpay-sbtc-v2

      # Token Contracts (Testnet)
      - key: USDCX_TOKEN_TESTNET
        value: ST1PQHQKV0RJXZFY1DGX8MNSNYVE3VGZJSRTPGZGM.usdcx
      - key: SBTC_TOKEN_TESTNET
        value: ST1PQHQKV0RJXZFY1DGX8MNSNYVE3VGZJSRTPGZGM.sbtc

      # Relayer Private Key (MUST BE SET IN RENDER DASHBOARD)
      - key: RELAYER_PRIVATE_KEY
        sync: false

      # xReserve Bridge Configuration
      - key: XRESERVE_ADDRESS
        value: 0x008888878f94C0d87defdf0B07f46B93C1934442
      - key: ETH_USDC_ADDRESS
        value: 0x1c7D4B196Cb0C7B01d743Fbc6116a902379C7238

      # Domain IDs
      - key: STACKS_DOMAIN_ID
        value: 10003
      - key: ETHEREUM_DOMAIN_ID
        value: 0

      # Optional: Fee configuration
      - key: RELAYER_FEE_PERCENTAGE
        value: 0.1

      # Optional: Minimum amounts (in micro-units)
      - key: MIN_DEPOSIT_AMOUNT
        value: 1000000
      - key: MIN_WITHDRAWAL_AMOUNT
        value: 4800000

      # x402 Multi-Asset Configuration
      - key: X402_FACILITATOR_URL
        value: https://facilitator.stacksx402.com
      - key: VENDOR_ADDRESS
        value: ST2TVNVEDWFBX25NRW8GP6D3WHAXEXGH7T3MBT1T1

      # Bot Worker URLs (Production)
      - key: SECURITY_BOT_URL
        value: https://veilpay-security-bot.onrender.com
      - key: TOKENOMICS_BOT_URL
        value: https://veilpay-tokenomics-bot.onrender.com
      - key: SENTIMENT_BOT_URL
        value: https://veilpay-sentiment-bot.onrender.com
      - key: COORDINATOR_BOT_URL
        value: https://veilpay-coordinator-bot.onrender.com

      # OpenAI API Key (for bot proxying)
      - key: OPENAI_API_KEY
        sync: false  # Set in Render dashboard

    healthCheckPath: /health
    autoDeploy: true

  # Security Bot Worker
  - type: web
    name: veilpay-security-bot
    runtime: node
    region: oregon
    plan: starter
    buildCommand: cd bots/examples/worker-bots/security-bot && npm install
    startCommand: cd bots/examples/worker-bots/security-bot && npm start
    envVars:
      - key: PORT
        value: 4001
      - key: OPENAI_API_KEY
        sync: false  # Set in Render dashboard
      - key: STACKS_API
        value: https://api.testnet.hiro.so
      - key: BOT_PRICE_STX
        value: 5
      - key: BOT_NAME
        value: VeilPay Security Auditor
      - key: BOT_DESCRIPTION
        value: AI-powered smart contract security analysis
    healthCheckPath: /health
    autoDeploy: true

  # Tokenomics Bot Worker
  - type: web
    name: veilpay-tokenomics-bot
    runtime: node
    region: oregon
    plan: starter
    buildCommand: cd bots/examples/worker-bots/tokenomics-bot && npm install
    startCommand: cd bots/examples/worker-bots/tokenomics-bot && npm start
    envVars:
      - key: PORT
        value: 4002
      - key: STACKS_API
        value: https://api.testnet.hiro.so
      - key: BOT_PRICE_STX
        value: 3
      - key: BOT_NAME
        value: VeilPay Tokenomics Analyzer
      - key: BOT_DESCRIPTION
        value: Token metrics and liquidity analysis
    healthCheckPath: /health
    autoDeploy: true

  # Sentiment Bot Worker
  - type: web
    name: veilpay-sentiment-bot
    runtime: node
    region: oregon
    plan: starter
    buildCommand: cd bots/examples/worker-bots/sentiment-bot && npm install
    startCommand: cd bots/examples/worker-bots/sentiment-bot && npm start
    envVars:
      - key: PORT
        value: 4003
      - key: OPENAI_API_KEY
        sync: false  # Set in Render dashboard
      - key: STACKS_API
        value: https://api.testnet.hiro.so
      - key: CRYPTOPANIC_API_KEY
        sync: false  # Optional - set in Render dashboard
      - key: BOT_PRICE_STX
        value: 2
      - key: BOT_NAME
        value: VeilPay Sentiment Analyzer
      - key: BOT_DESCRIPTION
        value: Multi-source project sentiment analysis
    healthCheckPath: /health
    autoDeploy: true

  # Coordinator Bot
  - type: web
    name: veilpay-coordinator-bot
    runtime: node
    region: oregon
    plan: starter
    buildCommand: cd bots/examples/coordinator-bot && npm install
    startCommand: cd bots/examples/coordinator-bot && npm start
    envVars:
      - key: PORT
        value: 4004
      - key: OPENAI_API_KEY
        sync: false  # Set in Render dashboard
      - key: STACKS_NETWORK
        value: testnet
      - key: CONTRACT_ADDRESS
        value: ST2TVNVEDWFBX25NRW8GP6D3WHAXEXGH7T3MBT1T1
      - key: VEILPAY_STX_CONTRACT
        value: ST2TVNVEDWFBX25NRW8GP6D3WHAXEXGH7T3MBT1T1.veilpay
      - key: COORDINATOR_PRIVATE_KEY
        sync: false  # Set in Render dashboard
      - key: SECURITY_BOT_URL
        value: https://veilpay-security-bot.onrender.com
      - key: TOKENOMICS_BOT_URL
        value: https://veilpay-tokenomics-bot.onrender.com
      - key: SENTIMENT_BOT_URL
        value: https://veilpay-sentiment-bot.onrender.com
      - key: BOT_PRICE_STX
        value: 10
      - key: BOT_NAME
        value: VeilPay Coordinator Bot
      - key: BOT_DESCRIPTION
        value: Full project analysis via all worker bots
    healthCheckPath: /health
    autoDeploy: true
